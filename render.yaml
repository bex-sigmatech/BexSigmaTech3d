services:
  - type: web
    name: bexsigmatech3d
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: PORT
        value: 5001
      - key: CASHFREE_ENV
        value: SANDBOX
      - key: ALLOW_SANDBOX_AUTO_VERIFY
        value: true
      - key: DOWNLOAD_TOKEN_SECRET
        sync: false
      - key: ADMIN_API_KEY
        sync: false
